<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" aria-labelledby="title desc" role="img" viewBox="0 0 1920 1080"><title id="title">SilentShift — catch meaning before delivery</title><desc id="desc">An example partner order says 20 CASE while its approved contract says 240 EA. SilentShift holds an unsupported change before the destination. Synthetic example.</desc><rect width="1920" height="1080" fill="#0B1116"/><g font-family="Manrope,Arial,sans-serif"><text x="100" y="126" fill="#EBF3F5" font-size="58" font-weight="600">SilentShift.</text><text x="100" y="292" fill="#EBF3F5" font-size="88" font-weight="600">Catch meaning</text><text x="100" y="398" fill="#EBF3F5" font-size="88" font-weight="600">before delivery.</text><rect width="780" height="220" x="100" y="490" fill="#121C23" stroke="#2B3D47" stroke-width="2" rx="18"/><text x="140" y="551" fill="#A2B4BC" font-size="29">PARTNER ORDER</text><text x="140" y="645" fill="#EBF3F5" font-size="75" font-weight="600">20 CASE</text><rect width="840" height="220" x="980" y="490" fill="#121C23" stroke="#44D6B4" stroke-width="2" rx="18"/><text x="1020" y="551" fill="#A2B4BC" font-size="29">APPROVED CONTRACT</text><text x="1020" y="645" fill="#44D6B4" font-size="75" font-weight="600">240 EA</text><text x="100" y="816" fill="#44D6B4" font-size="39">Native IRIS AI Hub investigation. Deterministic release policy.</text><text x="100" y="942" fill="#A2B4BC" font-size="28">2:30 captioned walkthrough · Synthetic records · IRIS destination simulator</text><text x="100" y="1000" fill="#A2B4BC" font-size="26">github.com/himanshu748/silentshift</text></g></svg>