      .initial-fallback a { color: var(--fallback-link); }
      .initial-fallback a:active { color: var(--fallback-text); }
      .initial-fallback a:focus-visible { outline: 2px solid var(--fallback-link); outline-offset: 4px; }
    </style>
  </head>
