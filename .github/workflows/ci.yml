name: Local safety and workbench checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SILENTSHIFT_CHROME_CHANNEL: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The policy-baseline guard compares against a frozen historical commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
      - run: node --test tests/receipt-inspector.test.mjs tests/recorded-tour.test.mjs
      - run: python scripts/test_java_core.py
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: npm ci
        working-directory: web
      - run: npm run check && npm run build
        working-directory: web
      # The runner supplies Chrome. Every browser test still executes through Playwright.
      - run: google-chrome --version
      - run: npm run test:e2e
        working-directory: web
      - run: node scripts/check_receipt_inspector.cjs
      - run: node scripts/check_evidence_tour.cjs
      # No restricted EAP image is uploaded or pulled by CI. Native proof is a
      # separate command on an operator-owned build154 installation, with local
      # inference or an explicitly authorized model budget.
