[project]
name = "silentshift"
version = "0.1.0"
description = "Deterministic semantic integrity checks embedded in native InterSystems IRIS workflows"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3,<10", "hypothesis>=6.120,<7"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = false
