# Based on the official intersystems-community/webgateway-examples demo-compose.
CSPModulePath "${ISC_PACKAGE_INSTALLDIR}/bin/"
CSPConfigPath "${ISC_PACKAGE_INSTALLDIR}/bin/"
<Location /silentshift>
    CSP On
</Location>
<Location /csp>
    CSP On
</Location>
<Location /csp/bin>
    Require all denied
</Location>
<Directory />
    Options FollowSymLinks
    AllowOverride None
    Require all granted
    <FilesMatch "\.(log|ini|pid|exe|so)$">
        Require all denied
    </FilesMatch>
</Directory>
